version: 2

models:

  - name: mrt__revenue_time
    description: |
      This model aggregates multiple KPI's link to revenue by order date from the `int_sales_enriched` table.

      It provides key metrics for each store, including:
      - Average order value
      - Net Revenue
      - Total Customers
      - Total Discount Given
      - Total Orders
      - Total Units Sold

    columns:

      - name: Order_Date
        tests:
          - not_null
