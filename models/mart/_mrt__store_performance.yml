version: 2

models:

  - name: mrt__store_performance
    description: |
      This model aggregates store sales data from the `int_sales_enriched` table.

      It provides key revenue metrics aggregated at the store level, including:
      - Average order value
      - Gross revenue
      - Net revenue
      - Revenue per customer
      - Total customers
      - Total discount given
      - Total orders
      - Total units sold

    columns:

      - name: store_id
        tests:
          - not_null

      - name: avg_order_value
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: gross_revenue
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: net_revenue
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: revenue_per_customer
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: total_customers
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: total_discount_given
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: total_orders
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: total_units_sold
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
