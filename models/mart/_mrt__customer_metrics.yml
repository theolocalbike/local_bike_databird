version: 2

models:

  - name: mrt__customer_metrics
    description: |
      Aggregates customer order data from `int_sales_enriched`.
      
      It provides key metrics for each customer, including:
      - First Purchase Date
      - Last Purchase Date
      - Avg order value
      - Is Repeat Customer
      - Lifetime Value
      - Total Orders
      - Total Units
      


    columns:

      - name: customer_id
        tests:
          - unique
          - not_null

      - name: first_purchase_date
        tests:
          - not_null

      - name: last_purchase_date
        tests:
          - not_null    

      - name: avg_order_value
        tests:
          - not_null

      - name: lifetime_value
        tests:
          - not_null

      - name: total_orders
        tests:
          - not_null

      - name: total_units
        tests:
          - not_null

      